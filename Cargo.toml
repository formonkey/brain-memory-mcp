[package]
name = "brain-memory-mcp"
version = "0.1.0"
edition = "2021"
description = "Local MCP server for vectorized Markdown memory."
license = "MIT"

[[bin]]
name = "brain-memory-mcp-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytemuck = "1.21"
clap = { version = "4.5", features = ["derive", "env"] }
fastembed = "5.17"
rmcp = { version = "0.16.0", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.31", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlite-vec = "0.1.9"
tokio = { version = "1.46", features = ["full"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"
